name: daily

on:
  schedule:
    - cron: "15 14 * * 1-5"   # 台灣時間平日 22:15:盤後計分
    - cron: "30 0 * * 2-6"    # 台灣時間隔日 08:30:重算前一交易日(官方更正後的定稿)
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期 YYYYMMDD(留空 = 最近一個交易日)"
        required: false
      force:
        description: "已是定稿也重算"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest -q

      - name: Run daily
        run: python -u run_daily.py ${{ inputs.date }} ${{ inputs.force && '--force' || '' }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "data: $(date +%F) 盤後更新"
            git push
          fi
